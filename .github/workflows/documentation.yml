name: Documentation

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the rolling branch
  push:
    branches: [ rolling ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build_documentation"
  build_documentation:
    # The type of runner that the job will run on
    runs-on: ubuntu-22.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-sphinx
            cd ./doc/sphinx/
            python3 -m venv .venv
            source .venv/bin/activate
            pip install -r requirements.txt
      - name: Build documentation
        run: |
            cd ./doc/sphinx/
            source .venv/bin/activate
            make html
            cd ../..
      # Replaces the tutorial's "git clone https://..." which only works on a public repository:
      # actions/checkout authenticates with the workflow token, so it also works on a private one.
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
      - name: Create commit
        run: |
            mkdir -p gh-pages/docs/
            cp -r ./doc/sphinx/build/html/* gh-pages/
            cd gh-pages
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            touch .nojekyll
            git add .
            git commit -m "Update documentation" -a || true
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          branch: gh-pages
          directory: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
